<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#17140F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Evvo Food">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Evvo Food — Atendente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="css/tokens.css">
<style>
  html { height: 100%; }

  /* ---- Tela: seleção de comanda ---- */
  #tela-selecao-comanda {
    flex: 1; display: flex; flex-direction: column; gap: 24px;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .bloco-nova-comanda { background: var(--ink-soft); border: 1px solid var(--ink-line); border-radius: var(--radius-lg); padding: 18px; }
  .bloco-nova-comanda h3 { font-family: var(--font-display); font-size: 15px; margin-bottom: 12px; }
  .bloco-nova-comanda .linha { display: flex; gap: 8px; }
  .bloco-nova-comanda input { flex: 1; }

  #lista-comandas-abertas { display: flex; flex-direction: column; gap: 8px; }
  .comanda-card {
    background: var(--ink-soft); border: 1px solid var(--ink-line); border-radius: var(--radius-md);
    padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; width: 100%;
  }
  .comanda-card .badge {
    font-family: var(--font-mono); font-size: 11px; text-transform: uppercase;
    background: var(--crust); color: var(--ink); padding: 3px 8px; border-radius: 4px;
  }
  .comanda-card .numero { font-family: var(--font-mono); color: var(--text-muted); font-size: 13px; }
  .comanda-card .comanda-atendente { font-size: 11px; color: var(--text-muted); }
  .aviso-vazio { color: var(--text-faint); font-size: 13px; text-align: center; padding: 20px 0; }


  /* ---- Tela: cardápio ---- */
  #tela-cardapio { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  .comanda-header { padding: 12px 16px; border-bottom: 1px solid var(--ink-line); display: flex; justify-content: space-between; align-items: center; }
  .comanda-header .voltar { font-size: 20px; color: var(--text-muted); }
  #codigo-comanda { font-family: var(--font-mono); font-size: 11px; color: var(--crust); }
  #titulo-comanda { font-family: var(--font-display); font-weight: 700; font-size: 18px; }

  #nav-categorias { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; flex-shrink: 0; }
  #nav-categorias .chip { flex-shrink: 0; }

  #grid-itens {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 4px 16px 16px; display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; align-content: start; grid-auto-rows: min-content;
  }
  .item-card {
    background: var(--ink-soft); border: 1px solid var(--ink-line); border-radius: var(--radius-md);
    padding: 12px; text-align: left; position: relative; display: flex; flex-direction: column; gap: 6px;
    min-height: 92px; align-self: start;
  }
  .item-nome { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .item-descricao { font-size: 11px; color: var(--text-faint); line-height: 1.3; }
  .item-preco { font-family: var(--font-mono); font-size: 12px; color: var(--crust); margin-top: auto; }
  .badge-destaque {
    position: absolute; top: -8px; right: 8px; background: var(--paprika); color: #fff;
    font-size: 9px; font-weight: 700; padding: 3px 6px; border-radius: 4px; text-transform: uppercase;
  }

  /* ---- Carrinho (sheet inferior) ---- */
  #carrinho-sheet {
    background: var(--ink-soft); border-top: 1px solid var(--ink-line); border-radius: 20px 20px 0 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    flex-shrink: 0; max-height: 40vh; display: flex; flex-direction: column;
  }
  #carrinho-lista { overflow-y: auto; margin-bottom: 10px; -webkit-overflow-scrolling: touch; }

  .obs-gerais-secao { border-top: 1px solid var(--ink-line); padding-top: 10px; margin-bottom: 10px; }
  .obs-gerais-secao .modal-secao-label { margin: 0 0 8px; }
  .obs-gerais-linha { display: flex; gap: 8px; margin-bottom: 8px; }
  .obs-gerais-linha input { flex: 1; font-size: 13px; padding: 10px 12px; }
  .obs-gerais-linha button {
    flex-shrink: 0; background: var(--ink-line); color: var(--text-primary);
    padding: 0 16px; border-radius: var(--radius-sm); font-weight: 700; font-size: 18px;
  }
  #lista-obs-gerais { display: flex; flex-direction: column; gap: 6px; }
  .obs-geral-item {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--ink); border: 1px solid var(--ink-line); border-radius: var(--radius-sm);
    padding: 8px 10px; font-size: 12px;
  }
  .obs-geral-item .btn-remover { font-size: 13px; }
  .carrinho-linha { display: flex; justify-content: space-between; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--ink-line); }
  .carrinho-linha-nome { font-size: 13px; font-weight: 600; }
  .carrinho-linha-obs { font-size: 11px; color: var(--text-faint); }
  .carrinho-linha-direita { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 13px; }
  .btn-remover { color: var(--paprika); font-size: 14px; }

  #carrinho-total-linha { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  #carrinho-total-linha .label { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
  #carrinho-total { font-family: var(--font-display); font-weight: 800; font-size: 20px; }

  #btn-enviar-pedido { width: 100%; }
  #btn-enviar-pedido:disabled { opacity: .4; }

  /* ---- Modal ---- */
  #modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: flex-end; justify-content: center; z-index: 100;
  }
  #modal-conteudo {
    position: relative;
    background: var(--ink); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0;
    padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); max-height: 85dvh; display: flex; flex-direction: column;
  }
  #modal-item-nome { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
  #modal-item-preco-base { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
  #modal-corpo { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; }
  .modal-secao-label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin: 14px 0 8px; }
  .ing-list { display: flex; flex-wrap: wrap; gap: 8px; }
  #modal-observacao-extra { margin-top: 4px; }
  #modal-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 12px; }
  #modal-total { font-family: var(--font-display); font-weight: 800; font-size: 20px; }
  #modal-footer button { flex-shrink: 0; }
  .modal-fechar { position: absolute; top: 16px; right: 16px; font-size: 20px; color: var(--text-muted); }

  /* Em telas maiores (notebook/tablet), o modal abre centralizado, não como bottom-sheet */
  @media (min-width: 768px) {
    #modal-overlay, #modal-pedidos-overlay { align-items: center; }
    #modal-conteudo, #modal-pedidos-conteudo {
      border-radius: var(--radius-lg);
      max-width: 480px;
      width: 90%;
      max-height: 80vh;
    }
  }

  /* ---- Modal: pedidos enviados (prévia do cupom) ---- */
  #modal-pedidos-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: flex-end; justify-content: center; z-index: 100;
  }
  #modal-pedidos-conteudo {
    position: relative;
    background: var(--ink); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0;
    padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); max-height: 85dvh;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .pedido-enviado-linha {
    border-bottom: 1px dashed var(--ink-line); padding: 10px 0; font-family: var(--font-mono); font-size: 12.5px;
  }
  .leva-pedido { margin-bottom: 6px; }
  .leva-cabecalho {
    font-family: var(--font-mono); font-size: 11px; color: var(--crust); text-transform: uppercase;
    letter-spacing: .03em; padding: 10px 0 4px; border-top: 1px solid var(--ink-line);
  }
  .leva-pedido:first-child .leva-cabecalho { border-top: none; padding-top: 0; }
  .pedido-enviado-linha .linha-topo { display: flex; justify-content: space-between; color: var(--text-primary); font-weight: 600; }
  .pedido-enviado-linha .linha-detalhe { color: var(--text-muted); margin-top: 3px; }
  .pedido-enviado-linha .linha-status {
    display: inline-block; margin-top: 4px; font-size: 10px; text-transform: uppercase;
    padding: 2px 6px; border-radius: 4px; background: rgba(92,122,82,.18); color: #9CBF8F;
  }
  .obs-geral-enviada {
    font-family: var(--font-mono); font-size: 12.5px; color: var(--crust); padding: 8px 0; border-bottom: 1px dashed var(--ink-line);
  }
  .btn-cancelar-item {
    display: block; margin-top: 6px; font-size: 11px; color: var(--paprika);
    text-decoration: underline; font-family: var(--font-body);
  }
  .btn-cancelar-comanda {
    width: 100%; margin-top: 18px; padding: 12px; background: rgba(214,67,42,.14);
    color: var(--paprika); border: 1px solid rgba(214,67,42,.4); border-radius: var(--radius-md);
    font-weight: 700; font-size: 13px;
  }

  #modal-confirmacao-generica-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  #modal-confirmacao-generica-conteudo {
    background: var(--ink); border-radius: var(--radius-lg); padding: 22px;
    width: 100%; max-width: 380px;
  }
  #modal-confirmacao-generica-conteudo h3 { font-family: var(--font-display); margin-bottom: 10px; }
  #confirmacao-generica-texto { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
  .modal-botoes { display: flex; gap: 10px; }
  .modal-botoes button { flex: 1; }

  /* Reforço final: garante que os dois modais fiquem centralizados em telas
     maiores, independente da ordem de outras regras acima (essa é sempre a última) */
  @media (min-width: 768px) {
    #modal-overlay, #modal-pedidos-overlay { align-items: center !important; }
    #modal-conteudo, #modal-pedidos-conteudo {
      border-radius: var(--radius-lg) !important;
      max-width: 480px !important;
      width: 90% !important;
      max-height: 80vh !important;
    }
  }
</style>
</head>
<body class="app-shell">

<div id="sidebar"></div>

<div class="main-area">

<!-- TELA 1: seleção/abertura de comanda -->
<div id="tela-selecao-comanda">
  <div class="bloco-nova-comanda">
    <h3>Nova comanda de mesa</h3>
    <div class="linha">
      <input type="text" id="input-numero-mesa" placeholder="Número da mesa" inputmode="numeric">
    </div>
    <div class="linha" style="margin-top:8px;">
      <input type="text" id="input-pessoa-mesa" placeholder="Nome da pessoa (opcional, se dividir a conta)">
      <button class="btn-primary" style="flex-shrink:0; padding:12px 18px;" onclick="abrirNovaComandaMesa()">Abrir</button>
    </div>
  </div>

  <div class="bloco-nova-comanda">
    <h3>Nova comanda avulsa (balcão)</h3>
    <div class="linha">
      <input type="text" id="input-nome-cliente" placeholder="Nome do cliente (opcional)">
      <button class="btn-primary" style="flex-shrink:0; padding:12px 18px;" onclick="abrirNovaComandaAvulsa()">Abrir</button>
    </div>
  </div>

  <div class="bloco-nova-comanda" id="bloco-nova-comanda-entrega" style="display:none;">
    <h3>Nova comanda de entrega</h3>
    <input type="text" id="input-entrega-nome-cliente" placeholder="Nome do cliente" style="margin-bottom:8px;">
    <input type="tel" id="input-entrega-telefone" placeholder="Telefone de contato" style="margin-bottom:8px;">
    <input type="text" id="input-entrega-endereco" placeholder="Endereço de entrega" style="margin-bottom:8px;">
    <div class="linha">
      <input type="text" inputmode="decimal" id="input-entrega-taxa" placeholder="Taxa de entrega (R$, opcional)">
      <button class="btn-primary" style="flex-shrink:0; padding:12px 18px;" onclick="abrirNovaComandaEntrega()">Abrir</button>
    </div>
  </div>

  <div>
    <h3 style="font-family: var(--font-display); font-size: 15px; margin-bottom: 12px;">Comandas abertas</h3>
    <div id="lista-comandas-abertas"><div class="aviso-vazio">Carregando...</div></div>
  </div>
</div>

<!-- TELA 2: cardápio + carrinho -->
<div id="tela-cardapio">
  <div class="comanda-header">
    <button class="voltar" onclick="voltarParaComandas()">←</button>
    <div style="text-align:center;">
      <div id="codigo-comanda">COMANDA #—</div>
      <div id="titulo-comanda">—</div>
    </div>
    <button class="voltar" onclick="abrirPedidosEnviados()" title="Ver pedidos já enviados">📋</button>
  </div>
  <div id="endereco-entrega-aviso" style="display:none; padding:8px 16px; background:var(--ink-soft); font-size:12px; color:var(--crust); text-align:center; border-bottom:1px solid var(--ink-line);"></div>

  <div id="nav-categorias"></div>
  <div id="grid-itens"></div>

  <div id="carrinho-sheet">
    <div id="carrinho-lista"></div>

    <div class="obs-gerais-secao">
      <div class="modal-secao-label">Observações gerais do pedido</div>
      <div class="obs-gerais-linha">
        <input type="text" id="input-obs-geral" placeholder="Ex: 3 copos com limão e gelo">
        <button onclick="adicionarObsGeral()">+</button>
      </div>
      <div id="lista-obs-gerais"></div>
    </div>

    <div id="carrinho-total-linha">
      <span class="label">Total do pedido</span>
      <span id="carrinho-total">R$ 0,00</span>
    </div>
    <button id="btn-enviar-pedido" class="btn-danger" disabled onclick="enviarPedido()">↳ Enviar pedido pra cozinha</button>
  </div>
</div>

<!-- MODAL: compor item -->
<div id="modal-overlay">
  <div id="modal-conteudo">
    <button class="modal-fechar" onclick="fecharModal()">✕</button>
    <div id="modal-item-nome">—</div>
    <div id="modal-item-preco-base">—</div>
    <div id="modal-corpo"></div>
    <div id="modal-footer">
      <span id="modal-total">R$ 0,00</span>
      <button class="btn-primary" style="flex:1;" onclick="confirmarAdicaoAoCarrinho()">Adicionar ao pedido</button>
    </div>
  </div>
</div>

<!-- MODAL: pedidos já enviados (prévia do que sai no cupom da cozinha) -->
<div id="modal-pedidos-overlay">
  <div id="modal-pedidos-conteudo">
    <button class="modal-fechar" onclick="fecharPedidosEnviados()">✕</button>
    <div class="modal-secao-label" style="margin-top:0;">Pedidos enviados pra cozinha</div>
    <div id="lista-pedidos-enviados"><div class="aviso-vazio">Carregando...</div></div>
    <button class="btn-cancelar-comanda" onclick="abrirConfirmacaoCancelarComanda()">Cancelar comanda inteira</button>
  </div>
</div>

<!-- MODAL: confirmação genérica (substitui confirm() nativo, que falha em PWA) -->
<div id="modal-confirmacao-generica-overlay">
  <div id="modal-confirmacao-generica-conteudo">
    <h3>Confirmar</h3>
    <p id="confirmacao-generica-texto"></p>
    <div class="modal-botoes">
      <button class="btn-ghost" onclick="fecharModalConfirmacaoGenerica()">Cancelar</button>
      <button class="btn-danger" onclick="executarConfirmacaoGenerica()">Confirmar</button>
    </div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/atendente.js"></script>

</div> <!-- fecha .main-area -->

</body>
</html>
