<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#17140F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Evvo Food">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Evvo Food — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="css/tokens.css">
<style>
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh; padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top));
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  .login-card {
    width: 100%; max-width: 360px;
  }
  .brand {
    text-align: center; margin-bottom: 32px;
  }
  .brand .logo {
    font-family: var(--font-display); font-weight: 800; font-size: 30px;
    color: var(--text-primary);
  }
  .brand .slogan {
    font-family: var(--font-mono); font-size: 12px; color: var(--crust);
    margin-top: 4px; letter-spacing: .02em;
  }
  .campo { margin-bottom: 14px; }
  .campo label {
    display: block; font-size: 12px; color: var(--text-muted);
    margin-bottom: 6px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .04em;
  }
  #btn-entrar { width: 100%; margin-top: 8px; }
  #mensagem-erro {
    color: var(--paprika); font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px;
  }
  #btn-entrar:disabled { opacity: .6; }
</style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <div class="logo">Evvo Food</div>
    <div class="slogan">"A evolução no comando do seu negócio."</div>
  </div>

  <form id="form-login">
    <div class="campo">
      <label for="username">Usuário</label>
      <input type="text" id="username" autocomplete="username" required autocapitalize="none">
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" required>
    </div>
    <button type="submit" id="btn-entrar" class="btn-primary">Entrar</button>
    <div id="mensagem-erro"></div>
  </form>
</div>

<script src="js/supabase-client.js"></script>
<script>
// Registra o Service Worker (necessário pro Android tratar a instalação
// como um app completo, não um atalho reduzido) — feito aqui também porque
// essa é a primeira tela que a pessoa abre, antes mesmo de logar
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch((erro) => {
    console.log('Service Worker não registrado:', erro);
  });
}

const form = document.getElementById('form-login');
const btnEntrar = document.getElementById('btn-entrar');
const mensagemErro = document.getElementById('mensagem-erro');

// Se veio de um logout forçado (conta desativada), avisa antes de mais nada
const parametrosUrl = new URLSearchParams(window.location.search);
if (parametrosUrl.get('motivo') === 'desativado') {
  mensagemErro.textContent = 'Sua conta foi desativada. Fale com o responsável.';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  mensagemErro.textContent = '';
  btnEntrar.disabled = true;
  btnEntrar.textContent = 'Entrando...';

  const username = document.getElementById('username').value.trim().toLowerCase();
  const senha = document.getElementById('senha').value;

  try {
    // 1) Descobrir o e-mail interno vinculado a esse username
    const { data: email, error: erroEmail } = await supabaseClient
      .rpc('fn_obter_email_por_username', { p_username: username });

    if (erroEmail || !email) {
      mensagemErro.textContent = 'Usuário não encontrado.';
      btnEntrar.disabled = false;
      btnEntrar.textContent = 'Entrar';
      return;
    }

    // 2) Login de fato
    const { data: sessao, error: erroLogin } = await supabaseClient.auth.signInWithPassword({
      email, password: senha,
    });

    if (erroLogin || !sessao?.user) {
      mensagemErro.textContent = 'Usuário ou senha incorretos.';
      btnEntrar.disabled = false;
      btnEntrar.textContent = 'Entrar';
      return;
    }

    // 3) Confirma se é o SUPER ADMIN da plataforma (nível acima de qualquer estabelecimento)
    const { data: souSuperAdmin } = await supabaseClient
      .from('super_admins')
      .select('id, nome')
      .eq('auth_user_id', sessao.user.id)
      .maybeSingle();

    if (souSuperAdmin) {
      sessionStorage.setItem('comandaflow_super_admin', JSON.stringify(souSuperAdmin));
      window.location.href = 'admin.html';
      return;
    }

    // 4) Se não for super admin, busca o perfil normal (nível de acesso, estabelecimento)
    const { data: perfil, error: erroPerfil } = await supabaseClient
      .from('perfis')
      .select('id, nome, username, nivel_acesso, estabelecimento_id')
      .eq('auth_user_id', sessao.user.id)
      .single();

    if (erroPerfil || !perfil) {
      mensagemErro.textContent = 'Não foi possível carregar seu perfil.';
      btnEntrar.disabled = false;
      btnEntrar.textContent = 'Entrar';
      return;
    }

    sessionStorage.setItem('comandaflow_perfil', JSON.stringify(perfil));

    // Volta pra página que a pessoa tentou acessar antes do login
    // (ex: se tentou abrir caixa.html direto, volta pra lá — senão, vai pro atendente)
    const parametros = new URLSearchParams(window.location.search);
    const destino = parametros.get('redirect') || 'atendente.html';
    window.location.href = destino;

  } catch (erro) {
    mensagemErro.textContent = 'Erro ao conectar. Verifique sua internet.';
    btnEntrar.disabled = false;
    btnEntrar.textContent = 'Entrar';
  }
});
</script>

</body>
</html>
